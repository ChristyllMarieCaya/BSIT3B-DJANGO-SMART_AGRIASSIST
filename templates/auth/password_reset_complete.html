{% extends "theme/base.html" %}
{% block title %}Password Updated — SMART AGRIASSIST{% endblock %}
{% block content %}
<div class="auth-utility-page">
  <div class="card auth-utility-card">
    <div class="card-body text-center">
      <span class="auth-form-mark mb-3"><i class="fa-solid fa-circle-check" aria-hidden="true"></i></span>
      <h1 class="h2">Password updated</h1>
      <p class="text-muted">Your password has been changed. You can now sign in with your new password.</p>
      <a class="btn btn-success w-100 mt-2" href="{% url 'login' %}">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
