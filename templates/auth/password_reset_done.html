{% extends "theme/base.html" %}
{% block title %}Check Your Email — SMART AGRIASSIST{% endblock %}
{% block content %}
<div class="auth-utility-page">
  <div class="card auth-utility-card">
    <div class="card-body text-center">
      <span class="auth-form-mark mb-3"><i class="fa-solid fa-envelope-circle-check" aria-hidden="true"></i></span>
      <h1 class="h2">Check your email</h1>
      <p class="text-muted">If an account matches that email address, you’ll receive a password reset link shortly.</p>
      <a class="btn btn-success w-100 mt-2" href="{% url 'login' %}">Back to sign in</a>
    </div>
  </div>
</div>
{% endblock %}
