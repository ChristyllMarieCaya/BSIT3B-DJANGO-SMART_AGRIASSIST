{% extends "theme/base.html" %}
{% block title %}Reset Password — SMART AGRIASSIST{% endblock %}
{% block content %}
<div class="auth-utility-page">
  <div class="card auth-utility-card">
    <div class="card-body">
      <span class="auth-form-mark mb-3"><i class="fa-solid fa-key" aria-hidden="true"></i></span>
      <h1 class="h2">Reset your password</h1>
      <p class="text-muted">Enter the email address associated with your account. We’ll send you a link to choose a new password.</p>
      <form method="post">
        {% csrf_token %}
        <label for="id_email" class="form-label">Email address</label>
        <input id="id_email" type="email" name="email" class="form-control mb-3" autocomplete="email" required>
        <button type="submit" class="btn btn-success w-100">Send reset link</button>
      </form>
      <a class="d-block text-center mt-3" href="{% url 'login' %}">Back to sign in</a>
    </div>
  </div>
</div>
{% endblock %}
